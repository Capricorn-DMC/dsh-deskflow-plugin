- insert:
    - id: deskflow
      name: '@local/deskflow'
      config:
        # 广播发现之外的单播兜底：对端开 VPN 抢默认路由时，局域网广播可能进隧道，
        # 单播按最长前缀匹配反而能到。填对端静态 IP，留空则该机制不生效。
        staticPeers:
          - 192.168.100.100
        # 心跳默认关闭：本版后端在心跳写失败时会掐断连接（连上约 10s 即断），
        # 属于被动保守而非配置失误。要开必须同时修后端容错，间隔 ≥30000。
        heartbeat: false
        # 关掉 DSH 后是否保留后台核心。默认 true = 保留，重新连接时接管同一个进程；
        # 若希望"关界面即停共享"（每次连接都是全新进程/令牌/配置），改为 false。
        keepRunningOnExit: true
